[project]
name = "examine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "emoji>=2.16.0",
    "kaleido>=1.5.0",
    "mylib",
    "polars>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
    "regex>=2026.9.29",
    "umap-learn>=0.5.12",
]

[project.scripts]
examine = "examine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/examine", "src/preprocess"]

[tool.uv.sources]
mylib = { path = "../mylib", editable = true }
